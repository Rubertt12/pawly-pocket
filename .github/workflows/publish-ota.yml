name: Publish Pawly Pocket live update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/react-js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate notification sound asset
        run: node scripts/create-notification-sound.mjs

      - name: Build web bundle
        run: npm run build

      - name: Package OTA update
        run: |
          cd dist
          zip -r ../pawly-pocket-ota.zip .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ota-${{ github.run_number }}
          name: Pawly Pocket OTA ${{ github.run_number }}
          target_commitish: rebuild/react-js
          generate_release_notes: true
          files: pawly-pocket-ota.zip
